<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    itsradio app icon: a tabletop radio whose tuning knob is the blue "o" --
    the O in radiO. Generated by assets/icon/generate.py (THEME='dark')
    from the same numbers as app_icon.png; edit the script, not this file.
    O outer R 172, inner R 106, stroke 16.
  -->
  <rect width="1024" height="1024" fill="#1B1A17"/>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="9"/>
      <feOffset dx="0" dy="7" result="offsetBlur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.35"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="switchTop"><rect x="176" y="496" width="80" height="92"/></clipPath>
  </defs>

  <g filter="url(#shadow)">
    <!-- body + antenna -->
    <rect x="72" y="248" width="880" height="614" rx="64" fill="#FBF9F5"/>
    <line x1="200" y1="256" x2="284" y2="78"
          stroke="#FBF9F5" stroke-width="16" stroke-linecap="round"/>
    <circle cx="284" cy="78" r="14" fill="#FBF9F5"/>

    <!-- tuning scale -->
    <rect x="128" y="316" width="372" height="128" rx="18" fill="#1B1A17"/>
    <text x="160.0" y="348.0" font-size="18" fill="#FBF9F5" font-family="Arial, Helvetica, sans-serif" font-weight="bold" text-anchor="middle" dominant-baseline="central">FM</text>
    <text x="160.0" y="412.0" font-size="18" fill="#FBF9F5" font-family="Arial, Helvetica, sans-serif" font-weight="bold" text-anchor="middle" dominant-baseline="central">AM</text>
    <text x="204.0" y="348.0" font-size="23" fill="#FBF9F5" font-family="Arial, Helvetica, sans-serif" font-weight="bold" text-anchor="middle" dominant-baseline="central">88</text>
    <text x="258.0" y="348.0" font-size="23" fill="#FBF9F5" font-family="Arial, Helvetica, sans-serif" font-weight="bold" text-anchor="middle" dominant-baseline="central">92</text>
    <text x="312.0" y="348.0" font-size="23" fill="#FBF9F5" font-family="Arial, Helvetica, sans-serif" font-weight="bold" text-anchor="middle" dominant-baseline="central">96</text>
    <text x="366.0" y="348.0" font-size="23" fill="#FBF9F5" font-family="Arial, Helvetica, sans-serif" font-weight="bold" text-anchor="middle" dominant-baseline="central">100</text>
    <text x="420.0" y="348.0" font-size="23" fill="#FBF9F5" font-family="Arial, Helvetica, sans-serif" font-weight="bold" text-anchor="middle" dominant-baseline="central">104</text>
    <text x="474.0" y="348.0" font-size="23" fill="#FBF9F5" font-family="Arial, Helvetica, sans-serif" font-weight="bold" text-anchor="middle" dominant-baseline="central">108</text>
    <text x="204.0" y="412.0" font-size="23" fill="#FBF9F5" font-family="Arial, Helvetica, sans-serif" font-weight="bold" text-anchor="middle" dominant-baseline="central">55</text>
    <text x="271.5" y="412.0" font-size="23" fill="#FBF9F5" font-family="Arial, Helvetica, sans-serif" font-weight="bold" text-anchor="middle" dominant-baseline="central">70</text>
    <text x="339.0" y="412.0" font-size="23" fill="#FBF9F5" font-family="Arial, Helvetica, sans-serif" font-weight="bold" text-anchor="middle" dominant-baseline="central">100</text>
    <text x="406.5" y="412.0" font-size="23" fill="#FBF9F5" font-family="Arial, Helvetica, sans-serif" font-weight="bold" text-anchor="middle" dominant-baseline="central">130</text>
    <text x="474.0" y="412.0" font-size="23" fill="#FBF9F5" font-family="Arial, Helvetica, sans-serif" font-weight="bold" text-anchor="middle" dominant-baseline="central">160</text>
    <g fill="#FBF9F5">
      <rect x="202.5" y="372.0" width="3" height="16" rx="1.5"/>
      <rect x="211.5" y="375.5" width="3" height="9" rx="1.5"/>
      <rect x="220.5" y="375.5" width="3" height="9" rx="1.5"/>
      <rect x="229.5" y="375.5" width="3" height="9" rx="1.5"/>
      <rect x="238.5" y="375.5" width="3" height="9" rx="1.5"/>
      <rect x="247.5" y="375.5" width="3" height="9" rx="1.5"/>
      <rect x="256.5" y="372.0" width="3" height="16" rx="1.5"/>
      <rect x="265.5" y="375.5" width="3" height="9" rx="1.5"/>
      <rect x="274.5" y="375.5" width="3" height="9" rx="1.5"/>
      <rect x="283.5" y="375.5" width="3" height="9" rx="1.5"/>
      <rect x="292.5" y="375.5" width="3" height="9" rx="1.5"/>
      <rect x="301.5" y="375.5" width="3" height="9" rx="1.5"/>
      <rect x="310.5" y="372.0" width="3" height="16" rx="1.5"/>
      <rect x="319.5" y="375.5" width="3" height="9" rx="1.5"/>
      <rect x="328.5" y="375.5" width="3" height="9" rx="1.5"/>
      <rect x="337.5" y="375.5" width="3" height="9" rx="1.5"/>
      <rect x="346.5" y="375.5" width="3" height="9" rx="1.5"/>
      <rect x="355.5" y="375.5" width="3" height="9" rx="1.5"/>
      <rect x="364.5" y="372.0" width="3" height="16" rx="1.5"/>
      <rect x="373.5" y="375.5" width="3" height="9" rx="1.5"/>
      <rect x="382.5" y="375.5" width="3" height="9" rx="1.5"/>
      <rect x="391.5" y="375.5" width="3" height="9" rx="1.5"/>
      <rect x="400.5" y="375.5" width="3" height="9" rx="1.5"/>
      <rect x="409.5" y="375.5" width="3" height="9" rx="1.5"/>
      <rect x="418.5" y="372.0" width="3" height="16" rx="1.5"/>
      <rect x="427.5" y="375.5" width="3" height="9" rx="1.5"/>
      <rect x="436.5" y="375.5" width="3" height="9" rx="1.5"/>
      <rect x="445.5" y="375.5" width="3" height="9" rx="1.5"/>
      <rect x="454.5" y="375.5" width="3" height="9" rx="1.5"/>
      <rect x="463.5" y="375.5" width="3" height="9" rx="1.5"/>
      <rect x="472.5" y="372.0" width="3" height="16" rx="1.5"/>
    </g>
    <rect x="289.5" y="324" width="5" height="112" rx="2.5" fill="#2E7BFF"/>

    <!-- AM/FM switch -->
    <rect x="176" y="496" width="80" height="184" rx="22" fill="#2E7BFF" clip-path="url(#switchTop)"/>
    <text x="216.0" y="542.0" font-size="24" fill="#FBF9F5" font-family="Arial, Helvetica, sans-serif" font-weight="bold" text-anchor="middle" dominant-baseline="central">FM</text>
    <text x="216.0" y="634.0" font-size="24" fill="#1B1A17" font-family="Arial, Helvetica, sans-serif" font-weight="bold" text-anchor="middle" dominant-baseline="central">AM</text>
    <rect x="176" y="496" width="80" height="184" rx="22" fill="none" stroke="#1B1A17" stroke-width="5"/>
    <line x1="176" y1="588" x2="256" y2="588" stroke="#1B1A17" stroke-width="5"/>

    <!-- REC button -->
    <circle cx="432" cy="566" r="40" fill="none" stroke="#1B1A17" stroke-width="5"/>
    <circle cx="432" cy="566" r="27" fill="#E53935"/>
    <text x="432.0" y="640.0" font-size="20" fill="#1B1A17" font-family="Arial, Helvetica, sans-serif" font-weight="bold" text-anchor="middle" dominant-baseline="central">REC</text>

    <!-- TALK button (push-to-talk): mic in a ring -->
    <circle cx="326" cy="566" r="40" fill="none" stroke="#1B1A17" stroke-width="5"/>
    <rect x="318" y="546" width="16" height="28" rx="8" fill="#1B1A17"/>
    <g fill="none" stroke="#1B1A17" stroke-width="4" stroke-linecap="round">
      <path d="M 311 564 a 15 15 0 0 0 30 0"/>
      <line x1="326" y1="579" x2="326" y2="586"/>
      <line x1="316" y1="586" x2="336" y2="586"/>
    </g>
    <text x="326.0" y="640.0" font-size="20" fill="#1B1A17" font-family="Arial, Helvetica, sans-serif" font-weight="bold" text-anchor="middle" dominant-baseline="central">TALK</text>

    <!-- ON AIR sign -->
    <rect x="176" y="720" width="306" height="56" rx="28" stroke="#1B1A17" stroke-width="6" fill="#E53935"/>
    <text x="329.0" y="748.0" font-size="26" fill="#FBF9F5" font-family="Arial, Helvetica, sans-serif" font-weight="bold" text-anchor="middle" dominant-baseline="central">ON AIR</text>

    <!-- the O as the tuning knob -->
    <path fill="#2E7BFF" fill-rule="evenodd"
      d="M 712 383 a 172 172 0 1 0 0.001 0 z
         M 712 449 a 106 106 0 1 1 -0.001 0 z"/>
    <circle cx="712" cy="555" r="106" fill="#1B1A17"/>
    <circle cx="712" cy="555" r="172" fill="none" stroke="#1B1A17" stroke-width="16"/>
    <circle cx="712" cy="555" r="106" fill="none" stroke="#1B1A17" stroke-width="16"/>
    <line x1="712" y1="555" x2="750.0" y2="489.2"
          stroke="#FBF9F5" stroke-width="12" stroke-linecap="round"/>
    <circle cx="712" cy="555" r="14" fill="#FBF9F5"/>
  </g>
</svg>
